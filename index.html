<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Client</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #messages { border: 1px solid #ccc; padding: 10px; min-height: 200px; overflow-y: scroll; margin-bottom: 10px; }
        .message { margin-bottom: 5px; }
        .status { color: gray; }
        .received { color: blue; }
        .sent { color: green; }
    </style>
</head>
<body>
    <h1>WebSocket Client</h1>
    <div id="messages"></div>
    <input type="text" id="messageInput" placeholder="Nhập tin nhắn...">
    <button id="sendButton">Gửi</button>

    <script>
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        let ws;

        function logMessage(message, type = 'status') {
            const p = document.createElement('p');
            p.className = 'message ' + type;
            p.textContent = message;
            messagesDiv.appendChild(p);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Auto-scroll to bottom
        }

        function connectWebSocket() {
            if (ws) {
                ws.close();
            }
            // Thay đổi địa chỉ này nếu máy chủ WebSocket của bạn chạy ở một địa chỉ khác
            ws = new WebSocket('ws://localhost:8887/'); // Kết nối đến máy chủ WebSocket của game

            ws.onopen = function(event) {
                logMessage('Đã kết nối đến máy chủ WebSocket.', 'status');
            };

            ws.onmessage = function(event) {
                logMessage('Nhận: ' + event.data, 'received');
            };

            ws.onclose = function(event) {
                if (event.wasClean) {
                    logMessage(`Đã đóng kết nối sạch sẽ, code=${event.code} reason=${event.reason}`, 'status');
                } else {
                    logMessage('Kết nối bị ngắt đột ngột.', 'status');
                }
            };

            ws.onerror = function(error) {
                logMessage('Lỗi WebSocket: ' + error.message, 'status');
            };
        }

        sendButton.addEventListener('click', function() {
            const message = messageInput.value;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(message);
                logMessage('Gửi: ' + message, 'sent');
                messageInput.value = '';
            } else {
                logMessage('Không thể gửi tin nhắn: Kết nối WebSocket chưa mở hoặc đã đóng.', 'status');
            }
        });

        // Kết nối khi tải trang
        connectWebSocket();
    </script>
</body>
</html>
